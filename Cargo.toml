[package]
name = "shopping-sessions-engine"
version = "0.1.0"
description = "Turns Shopping Sessions click-stream CSVs into the user_daily and campaign_daily Parquet tables."
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[[bin]]
name = "engine"
path = "src/main.rs"

[dependencies]
parselab = { path = "crates/parselab" }
pqw = { path = "crates/pqw" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# unwind: a panic in the fast path is caught and the run falls back to v1 (never a crash).
panic = "unwind"
debug = false
