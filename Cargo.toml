[package]
name = "shopping-sessions-engine"
version = "0.1.0"
description = "Turns Shopping Sessions click-stream CSVs into the user_daily and campaign_daily Parquet tables."
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[[bin]]
name = "engine"
path = "src/main.rs"

[dependencies]
bytes = "1"
memchr = "2"
memmap2 = "0.9"
mimalloc = { version = "0.1", default-features = false }
parquet = { version = "60", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
