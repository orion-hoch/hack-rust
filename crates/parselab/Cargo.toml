[package]
name = "parselab"
version = "0.1.0"
description = "Bytes to records for Shopping Sessions: RECORDS.md shapes, a scalar reference parser and the fast parser."
edition = "2024"
license = "MIT"
publish = false

[features]
phases = []
# Do the vector batches' multiplies as 256-bit halves (no heavy 512-bit instruction): for CPUs
# that lower their clock on heavy 512-bit code (Skylake-SP, Cascade Lake). Same records.
mul256 = []
# Force the full 512-bit multiplies (overrides the CPU-model choice).
mul512 = []

[lib]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
